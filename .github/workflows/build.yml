name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach files to a release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build-tools 30.0.3 (last with dx) and platform 30
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;30.0.3" "platforms;android-30" > /dev/null

      - name: Install mksh (the head unit's shell)
        run: sudo apt-get install -y -qq mksh > /dev/null

      - name: Check shell scripts parse (sh and mksh)
        run: |
          for f in package/svc/*.sh package/scripts/*.sh research/probe-12v/NEMESIS.sh; do
            sh -n "$f"; mksh -n "$f"
          done

      - name: Build mksh R43 (the exact shell on the 2023 Ioniq 5 head unit)
        run: |
          git clone -q --depth 1 --branch mksh-R43 https://github.com/MirBSD/mksh.git /tmp/mksh-r43
          cd /tmp/mksh-r43
          export CFLAGS="-O1 -w -std=gnu99 -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"
          sh ./Build.sh -r > build.log 2>&1 \
            || { grep -vE '^\$ |conftest' build.log | tail -n 9 | cut -c1-300 | while IFS= read -r l; do echo "::error title=mksh build::$l"; done; exit 1; }
          ./mksh -c 'echo "$KSH_VERSION"'

      - name: Test the monitor service with mocked car services
        run: |
          tests/test_service.sh sh
          tests/test_service.sh mksh
          set -o pipefail
          tests/test_service.sh /tmp/mksh-r43/mksh 2>&1 | tee r43.log \
            || { tail -n 15 r43.log | while IFS= read -r l; do echo "::error title=mksh R43::$l"; done; exit 1; }

      - name: Build APK
        run: |
          set -o pipefail
          ANDROID_SDK="$ANDROID_SDK_ROOT" tools/build_apk.sh 2>&1 | tee build.log \
            || { tail -n 15 build.log | while IFS= read -r l; do echo "::error title=build_apk::$l"; done; exit 1; }

      - name: Build NEMESIS package + USB bundle
        run: |
          cp app/batterywatchdog.apk package/app/batterywatchdog.apk
          tools/make_package.sh

      - name: Bundle the probe for USB
        run: (cd research/probe-12v && zip -X ../../dist/probe-12v-USB.zip NEMESIS.data NEMESIS.sh)

      - uses: actions/upload-artifact@v4
        with:
          name: gen5w-BatteryWatchdog-${{ github.sha }}
          path: |
            dist/gen5w-BatteryWatchdog-USB.zip
            dist/battery.watchdog.zip
            dist/probe-12v-USB.zip
            app/batterywatchdog.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            dist/gen5w-BatteryWatchdog-USB.zip dist/battery.watchdog.zip dist/probe-12v-USB.zip app/batterywatchdog.apk \
          || gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/gen5w-BatteryWatchdog-USB.zip dist/battery.watchdog.zip dist/probe-12v-USB.zip app/batterywatchdog.apk
